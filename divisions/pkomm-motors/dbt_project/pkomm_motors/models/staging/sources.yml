version: 2

sources:
  - name: bronze
    schema: bronze
    description: "Raw data ingested from Pkomm Motors source systems"
    tables:
      - name: locations
        description: "5 Pkomm Motors branch locations"
      - name: employees
        description: "All salespeople and service technicians across all branches"
      - name: vehicles
        description: "Lot changes from the dealer system: cars arriving and cars sold. One row per change, so a car can appear more than once"
      - name: sales_transactions
        description: "Every car sale, appended one business day at a time (_batch_date)"
      - name: service_jobs
        description: "Every service center job completed"
        

  - name: control
    schema: control
    description: "Bookkeeping for closed days. Written by the loader, never by dbt"
    tables:
      - name: closed_days
        description: "Business days that are closed and can no longer change"
      - name: closed_day_totals
        description: "Units and revenue per branch for each closed day, recorded the moment it closed"
