name: Keep dashboards awake

# Streamlit sleeps an app after 12 hours without a visitor. Visiting every
# 6 hours means a recruiter never lands on the "wake this app up" page.
on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  visit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install a headless browser
        run: |
          pip install playwright==1.48.0
          python -m playwright install --with-deps chromium

      - name: Visit each dashboard
        run: python scripts/keep_dashboards_awake.py

      # GitHub turns off scheduled workflows in a repo with no activity for 60 days.
      # Enabling it again on each run keeps this one switched on.
      - name: Keep this schedule switched on
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable keep-dashboards-awake.yml --repo ${{ github.repository }}
